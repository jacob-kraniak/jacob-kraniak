name: Update Certifications in Profile README

on:
  issues:
    types: [edited, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  update-certs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Cert Status from Project Board
        uses: actions/github-script@v7
        id: cert-data
        with:
          script: |
            const projectNumber = 3;
            const owner = "jacob-kraniak";
            
            const query = `query($owner: String!, $projectNumber: Int!) {
              user(login: $owner) {
                projectV2(number: $projectNumber) {
                  items(first: 100) {
                    nodes {
                      content { ... on Issue { number title url } }
                      fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                    }
                  }
                }
              }
            }`;
            
            const result = await github.graphql(query, { owner, projectNumber });
            let rows = "";
            result.user.projectV2.items.nodes.forEach(item => {
              if (item.content) {
                const status = item.fieldValueByName?.name || "Unknown";
                if (status === "Active") {rows += `| [${item.content.title}](https://github.com/jacob-kraniak/cybersecurity-certification-tracker/issues/${item.content.number}) | ISC² | Active | May 2026 | N/A | [Credly](https://www.credly.com/users/jacob-kraniak/badges) • [Issue #${item.content.number}](${item.content.url}) |\n`;}
              }
            });
            core.setOutput("table_rows", rows || "| No active certifications found. | - | - | - | - | - |");

      - name: Update README with Python
        run: python scripts/update_certs.py "${{ steps.cert-data.outputs.table_rows }}"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update certifications from project board (CC test)"
          file_pattern: README.md
