name: Update Certifications in Profile README

on:
  issues:
    types: [edited, reopened, closed]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write
  issues: read

jobs:
  update-certs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Credly Badges
        run: |
          curl -sL -H "Accept: application/json" \
               "https://www.credly.com/users/jacob-kraniak/badges.json?page=1&page_size=50" \
               -o badges.json
          jq -e '.data | type == "array"' badges.json > /dev/null

      - name: Export Tracker Issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: "jacob-kraniak",
              repo: "cybersecurity-certification-tracker",
              state: "all",
              per_page: 100
            });
            const slim = issues.map(i => ({
              number: i.number,
              title: i.title,
              body: i.body || "",
              state: i.state,
              labels: (i.labels || []).map(l => l.name),
              updated_at: i.updated_at
            }));
            fs.writeFileSync("tracker_issues.json", JSON.stringify(slim, null, 2));
            console.log(`Exported ${slim.length} tracker issues`);

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild Certification Details
        run: python scripts/update_certs.py

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(mcp): auto-update Certification Details from Credly + tracker"
          file_pattern: README.md
          branch: main
