name: Update Active Credly Badges

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  update-badges:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Active Certification Titles from Project Board
        id: active-titles
        uses: actions/github-script@v7
        with:
          script: |
            const projectNumber = 3;
            const owner = "jacob-kraniak";

            const query = `query($owner: String!, $projectNumber: Int!) {
              user(login: $owner) {
                projectV2(number: $projectNumber) {
                  items(first: 100) {
                    nodes {
                      content { ... on Issue { title } }
                      fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                    }
                  }
                }
              }
            }`;

            const result = await github.graphql(query, { owner, projectNumber });
            const activeTitles = result.user.projectV2.items.nodes
              .filter(item => item.fieldValueByName?.name === "Active" && item.content?.title)
              .map(item => item.content.title.toLowerCase());
            core.setOutput("active_titles", JSON.stringify(activeTitles));
            console.log("Active titles:", activeTitles);

      - name: Fetch Credly Badges (robust)
        id: fetch-badges
        run: |
          curl -sL -H "Accept: application/json" \
               "https://www.credly.com/users/jacob-kraniak/badges.json?page=1&page_size=50" \
               -o badges.json

          echo "=== badges.json size: $(wc -c < badges.json) bytes ==="
          echo "=== First 600 chars ==="
          head -c 600 badges.json
          echo
          echo "=== jq type ==="
          jq -r 'type' badges.json || true

          # Validate structure
          if jq -e '.data | type == "array"' badges.json > /dev/null 2>&1; then
            echo "✓ Valid .data array found"
            echo "Total badges in response: $(jq '.data | length' badges.json)"
            echo "Sample badge names:"
            jq -r '.data[0:5] | .[] | .badge_template.name // "(no name)"' badges.json || true
          else
            echo "✗ Invalid structure - dumping head"
            head -c 400 badges.json
          fi

      - name: Filter & Format Active Badges
        id: filter
        run: |
          ACTIVE_TITLES='${{ steps.active-titles.outputs.active_titles }}'

          if [ -s badges.json ] && jq -e '.data | type == "array"' badges.json > /dev/null 2>&1; then
            FILTERED_BADGES=$(jq -r --argjson active "$ACTIVE_TITLES" '
              .data[]
              | select(.state == "accepted")
              | select(.badge_template != null)
              | select(
                  (.badge_template.name | ascii_downcase | contains($active[])) or
                  ($active[] | contains(.badge_template.name | ascii_downcase))
                )
              | "\(.badge_template.image_url // "")|\(.badge_template.name // "")|\(.badge_template.public_url // .public_url // "")"
            ' badges.json | grep -v '^||' | head -n 8 | tr '\n' ';;' | sed 's/;;$//')

            echo "BADGE_DATA=$FILTERED_BADGES" >> $GITHUB_ENV
            COUNT=$(echo "$FILTERED_BADGES" | grep -o ';;' | wc -l | awk '{print $1 + 1}')
            echo "Found $COUNT matching active badges after filtering"
          else
            echo "BADGE_DATA=" >> $GITHUB_ENV
            echo "Skipping - invalid or empty Credly data"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Update Badges + Download Images
        run: python scripts/update_active_badge.py "$BADGE_DATA"

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(mcp): auto-update Active Badges (Project Board filtered) + high-res images"
          file_pattern: README.md images/*
          branch: main