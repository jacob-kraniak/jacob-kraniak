name: Update Active Credly Badges

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  update-badges:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Active Cert Titles from README Table
        id: active-from-readme
        run: |
          # First markdown link in each Certification Details row = cert name
          # (NOT the Notes-column "Issue #N" link — greedy .* was matching that)
          python3 << 'PY'
          import re
          from pathlib import Path
          text = Path("README.md").read_text(encoding="utf-8")
          m = re.search(r"### Certification Details([\s\S]*?)(?=\n### |\n## |\Z)", text)
          titles = []
          if m:
              for line in m.group(1).splitlines():
                  if not line.strip().startswith("|"):
                      continue
                  if re.search(r"Certification\s*\|\s*Issuer|---", line):
                      continue
                  # first [text](url) on the row
                  link = re.search(r"\[\s*([^\]]+?)\s*\]\([^)]+\)", line)
                  if link:
                      title = link.group(1).strip()
                      if title and not title.lower().startswith("issue #"):
                          titles.append(title)
          Path("active_titles_readme.txt").write_text("\n".join(titles), encoding="utf-8")
          print("Active titles from table:", titles)
          PY

      - name: Fetch Active Certification Titles from Project Board (backup)
        id: active-titles
        uses: actions/github-script@v7
        with:
          script: |
            const projectNumber = 3;
            const owner = "jacob-kraniak";
            const query = `query($owner: String!, $projectNumber: Int!) {
              user(login: $owner) {
                projectV2(number: $projectNumber) {
                  items(first: 100) {
                    nodes {
                      content { ... on Issue { title } }
                      fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }
              }
            }`;
            let activeTitles = [];
            try {
              const result = await github.graphql(query, { owner, projectNumber });
              activeTitles = result.user.projectV2.items.nodes
                .filter(item => item.fieldValueByName?.name === "Active" && item.content?.title)
                .map(item => item.content.title);
            } catch (e) {
              console.log("Project Board query failed (continuing with README titles):", e.message || e);
            }
            const fs = require("fs");
            fs.writeFileSync("active_titles_board.json", JSON.stringify(activeTitles));
            console.log("Active titles from Project Board:", activeTitles);

      - name: Fetch Credly Badges
        run: |
          curl -sL -H "Accept: application/json" \
               "https://www.credly.com/users/jacob-kraniak/badges.json?page=1&page_size=50" \
               -o badges.json
          echo "=== badges.json size: $(wc -c < badges.json) bytes ==="
          jq -r '.data[]? | select(.state=="accepted") | .badge_template.name // "(no name)"' badges.json || true
          if ! jq -e '.data | type == "array"' badges.json > /dev/null 2>&1; then
            echo "::error::Invalid Credly badges.json structure"
            exit 1
          fi

      - name: Filter Badges Against README + Board Titles
        run: |
          python3 << 'PY'
          import json, re
          from pathlib import Path

          def norm(s: str) -> str:
              return re.sub(r"[^a-z0-9]+", " ", (s or "").lower()).strip()

          def tokens(s: str) -> set[str]:
              stop = {"certification", "certified", "ce", "the", "in", "and", "of", "a", "plus"}
              return {t for t in norm(s).split() if len(t) > 1 and t not in stop}

          titles = []
          p = Path("active_titles_readme.txt")
          if p.exists():
              titles.extend([t.strip() for t in p.read_text(encoding="utf-8").splitlines() if t.strip()])
          bp = Path("active_titles_board.json")
          if bp.exists():
              try:
                  titles.extend(json.loads(bp.read_text(encoding="utf-8")))
              except json.JSONDecodeError:
                  pass
          # unique preserve order
          seen = set()
          uniq_titles = []
          for t in titles:
              k = norm(t)
              if k and k not in seen:
                  seen.add(k)
                  uniq_titles.append(t)
          print("Combined titles:", uniq_titles)

          raw = json.loads(Path("badges.json").read_text(encoding="utf-8"))
          badges = [b for b in (raw.get("data") or []) if b.get("state") == "accepted" and b.get("badge_template")]

          def matches(badge_name: str) -> bool:
              bt = tokens(badge_name)
              bn = norm(badge_name)
              if not uniq_titles:
                  # No title list → include all accepted (safe fallback)
                  return True
              for title in uniq_titles:
                  tt = tokens(title)
                  tn = norm(title)
                  if not tt:
                      continue
                  # mutual containment of normalized strings or token overlap
                  if tn in bn or bn in tn:
                      return True
                  overlap = tt & bt
                  if len(overlap) >= 2:
                      return True
                  # strong single-token matches for short names (A+, CC, Server+, Network+)
                  strong = {"server", "network", "cybersecurity", "cc"}
                  if overlap & strong:
                      return True
                  if "a" in tt and ("a" in bt or "a+" in tn or "a+" in bn or re.search(r"\ba\+", tn) or re.search(r"\ba\+", bn)):
                      return True
                  # CompTIA A+ title tokens may just be {'comptia'} after stopwords — handle explicitly
                  if re.search(r"\ba\+", tn) and re.search(r"\ba\+", bn):
                      return True
                  if "comptia" in tt and "comptia" in bt and (tt & bt) - {"comptia"}:
                      return True
              return False

          filtered = []
          for b in badges:
              t = b["badge_template"]
              name = t.get("name") or ""
              if not matches(name):
                  print("Skip (no title match):", name)
                  continue
              image = t.get("image_url") or ""
              # Prefer public badge page URL
              url = f"https://www.credly.com/badges/{b.get('id')}" if b.get("id") else (t.get("url") or t.get("public_url") or "")
              if not image or not name:
                  continue
              filtered.append({
                  "id": b.get("id"),
                  "name": name,
                  "image_url": image,
                  "url": url,
                  "issued_at_date": b.get("issued_at_date"),
              })
              print("Keep:", name)

          Path("filtered_badges.json").write_text(json.dumps(filtered, indent=2), encoding="utf-8")
          print(f"Wrote filtered_badges.json with {len(filtered)} badges")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Update Badges + Download Images
        run: python scripts/update_active_badge.py

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(mcp): auto-update Active Badges (matched from README + Project Board)"
          file_pattern: README.md images/*
          branch: main
