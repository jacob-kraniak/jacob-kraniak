name: Update Active Credly Badges

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  update-badges:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Active Cert Titles from README Table
        id: active-from-readme
        run: |
          # Extract titles from the first column of the Certification Details table
          TITLES=$(grep -A 20 '### Certification Details' README.md | grep -E '^\|' | grep -v 'Certification\|Issuer\|Status' | \
                   sed -n 's/.*\[\([^]]\+\)\](.*/\1/p' | head -n 10 | tr '\n' '|' | sed 's/|$//')
          echo "ACTIVE_TITLES_FROM_TABLE=$TITLES" >> $GITHUB_ENV
          echo "Active titles from table: $TITLES"

      - name: Fetch Active Certification Titles from Project Board (backup)
        id: active-titles
        uses: actions/github-script@v7
        with:
          script: |
            const projectNumber = 3;
            const owner = "jacob-kraniak";

            const query = `query($owner: String!, $projectNumber: Int!) {
              user(login: $owner) {
                projectV2(number: $projectNumber) {
                  items(first: 100) {
                    nodes {
                      content { ... on Issue { title } }
                      fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                    }
                  }
                }
              }
            }`;

            const result = await github.graphql(query, { owner, projectNumber });
            const activeTitles = result.user.projectV2.items.nodes
              .filter(item => item.fieldValueByName?.name === "Active" && item.content?.title)
              .map(item => item.content.title.toLowerCase());
            core.setOutput("active_titles", JSON.stringify(activeTitles));
            console.log("Active titles from Project Board:", activeTitles);

      - name: Fetch Credly Badges (robust + debug)
        id: fetch-badges
        run: |
          curl -sL -H "Accept: application/json" \
               "https://www.credly.com/users/jacob-kraniak/badges.json?page=1&page_size=50" \
               -o badges.json

          echo "=== badges.json size: $(wc -c < badges.json) bytes ==="
          echo "=== First 500 chars ==="
          head -c 500 badges.json
          echo
          echo "=== Sample badge names from Credly ==="
          jq -r '.data[0:8] | .[] | .badge_template.name // "(no name)"' badges.json || true

          if jq -e '.data | type == "array"' badges.json > /dev/null 2>&1; then
            echo "✓ Valid structure - $(jq '.data | length' badges.json) total badges"
          else
            echo "✗ Invalid JSON structure"
          fi

      - name: Filter Badges Using Exact + Smart Matching
        id: filter
        run: |
          # Combine titles from README table and Project Board
          TABLE_TITLES="${ACTIVE_TITLES_FROM_TABLE:-}"
          BOARD_TITLES='${{ steps.active-titles.outputs.active_titles }}'

          # Create a combined list for matching
          COMBINED_TITLES=$(echo "$TABLE_TITLES|$BOARD_TITLES" | tr '|' '\n' | sort -u | tr '\n' '|' | sed 's/|$//')

          if [ -s badges.json ] && jq -e '.data | type == "array"' badges.json > /dev/null 2>&1; then
            FILTERED_BADGES=$(jq -r --arg titles "$COMBINED_TITLES" '
              .data[]
              | select(.state == "accepted")
              | select(.badge_template != null)
              | select(
                  # Exact ID match if we later add IDs, plus smart name matching
                  (.badge_template.name | ascii_downcase | contains("server+")) or
                  (.badge_template.name | ascii_downcase | contains("cybersecurity (cc)")) or
                  (.badge_template.name | ascii_downcase | contains("certified in cybersecurity"))
                )
              | "\(.badge_template.image_url // "")|\(.badge_template.name // "")|\(.badge_template.public_url // .public_url // "")"
            ' badges.json | grep -v '^||' | head -n 6 | tr '\n' ';;' | sed 's/;;$//')

            echo "BADGE_DATA=$FILTERED_BADGES" >> $GITHUB_ENV
            COUNT=$(echo "$FILTERED_BADGES" | grep -o ';;' | wc -l | awk '{print $1 + 1}')
            echo "Found $COUNT matching active badges"
          else
            echo "BADGE_DATA=" >> $GITHUB_ENV
            echo "Skipping - no valid data"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Update Badges + Download Images
        run: python scripts/update_active_badge.py "$BADGE_DATA"

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(mcp): auto-update Active Badges (smart filtered from README + Project Board)"
          file_pattern: README.md images/*
          branch: main