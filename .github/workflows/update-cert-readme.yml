name: Update Certifications in Profile README

on:
  issues:
    types: [edited, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write     # Needed to commit changes to README.md
  issues: read        # To read issue context

jobs:
  update-certs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test - Log trigger info
        run: |
          echo "✅ Workflow triggered!"
          echo "Event: ${{ github.event_name }}"
          echo "Issue: ${{ github.event.issue.number || 'N/A' }}"
          echo "Action: ${{ github.event.action || 'N/A' }}"
